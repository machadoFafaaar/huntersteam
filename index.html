<import { useState, useEffect } from "react">
<import { motion } from "framer-motion";

<const highlights = [
  { title: "Campeões do Torneio X!", image: "/img/trophy.jpg" },
  { title: "Novo Uniforme Lançado!", image: "/img/uniform.jpg" },
  { title: "Próximo Jogo: Hunters vs Rivais", image: "/img/match.jpg" },
];

<const messages = ["Caçando vitórias!", "Unidos pela paixão!", "Rumo ao topo!"]

<export default function HomePage() {
  const [messageIndex, setMessageIndex] = useState(0);

  useEffect(() => {
    <const interval = setInterval(() => {
      <setMessageIndex((prev) => (prev + 1) % messages.length);
    }, 3000);<
    return () => clearInterval(interval);
  }, []);<

  return (
    <div className="flex flex-col items-center justify-center min-h-screen bg-black text-white">
      {/* Banner animado */}
      <motion.div
        className="text-3xl font-bold my-4"
        animate={{ opacity: [0, 1], y: [-10, 0] }}
        transition={{ duration: 0.8 }}
        key={messageIndex}
      >
        {messages[messageIndex]}
      </motion.div>

      {/* Carrossel de Destaques */}
      <div className="w-full flex overflow-x-scroll gap-4 p-4">
        {highlights.map((item, index) => (
          <div key={index} className="min-w-[250px] flex flex-col items-center">
            <img
              src={item.image}
              alt={item.title}
              className="rounded-lg shadow-lg h-40 w-auto"
            />
            <p className="text-lg mt-2">{item.title}</p>
          </div>
        ))}
      </div>

      {/* Botões de Navegação */}
      <div className="flex gap-4 mt-6">
        <button className="bg-gray-700 px-4 py-2 rounded-md">Calendário de Jogos</button>
        <button className="bg-blue-700 px-4 py-2 rounded-md">Últimas Notícias</button>
        <button className="bg-green-700 px-4 py-2 rounded-md">Loja Oficial</button>
      </div>
    </div>
  );
}
