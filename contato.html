<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Hunters</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #000000, #3a0a0a);
            color: #fff;
        }

        header {
            background-color: #7a0808;
            padding: 30px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #111;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
            animation: fadeIn 1.2s ease-in-out;
        }

        .container h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #ff2e2e;
        }

        .container p {
            text-align: center;
            color: #bbb;
            margin-bottom: 25px;
        }

        form label {
            font-weight: bold;
            display: block;
            margin: 15px 0 5px;
            color: #ddd;
        }

        form input, form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            background: #222;
            color: #fff;
            transition: 0.3s;
        }

        form input:focus, form textarea:focus {
            border-color: #ff2e2e;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff2e2e, #7a0808);
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            padding: 20px;
            background: #7a0808;
            color: #fff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>Contato - Hunters FC</header>

    <div class="container">
        <h1>Fale Conosco</h1>
        <p>Envie sua mensagem pelo formulário abaixo. Nossa equipe responderá o mais rápido possível!</p>

        <form action="enviar_mensagem.php" method="POST">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="assunto">Assunto:</label>
            <input type="text" id="assunto" name="assunto" required>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="6" required></textarea>

            <button type="submit">Enviar Mensagem</button>
        </form>
    </div>

    <footer>
        &copy; 2025 Clube de Futebol Hunters - Todos os direitos reservados.
    </footer>

</body>
</html>
